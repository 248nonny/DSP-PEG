
[workspace]
package.version = "0.0.1"
members = [
  "userspace",
  "baremetal",
  "lib/dsp-core", "lib/effects", "lib/common",
]

package.edition = "2024"

resolver = "2"


[profile.release]
debug = true

[profile.release-baremetal]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
debug = true
overflow-checks = false
incremental = false

