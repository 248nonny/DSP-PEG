[package]
name = "userspace"
version = "0.0.1"
edition.workspace = true

[dependencies]
eframe = {version = "0.33.2", default-features = false, features = [
    "x11",
    "glow",
    "default_fonts",
] }
libc = "0.2"
common = { path = "../lib/common" }
log = "0.4.29"
simple-log = "2.4.0"
log-panics = "2"
chrono = "0.4.43"

[features]
default = ["rpi"]
rpi = []
remote_linux = []
remote_windows = []
